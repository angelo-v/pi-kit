<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD List</title>

  <!-- Web Awesome -->
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.7.0/styles/themes/default.css" />
  <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.7.0/styles/native.css" />
  <script type="module" src="https://ka-f.webawesome.com/webawesome@3.7.0/webawesome.loader.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #f9fafb;
      --color-surface: #ffffff;
      --color-border: #e5e7eb;
      --color-primary: #4f46e5;
      --color-danger: #dc2626;
      --sidebar-w: 380px;
      font-family: system-ui, sans-serif;
      color: #111827;
      line-height: 1.5;
      background: var(--color-bg);
    }

    /* === App shell === */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* === Toolbar === */
    .toolbar {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .toolbar h1 {
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
    }

    /* === Split layout === */
    .split {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* === List panel === */
    .list-panel {
      width: var(--sidebar-w);
      border-right: 1px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-search {
      padding: 0.75rem;
      border-bottom: 1px solid var(--color-border);
    }

    .list-body {
      flex: 1;
      overflow-y: auto;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .list-item:hover { background: #f3f4f6; }
    .list-item.active { background: #ede9fe; }

    .list-item .item-info { flex: 1; min-width: 0; }
    .list-item .item-name {
      font-weight: 600;
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-item .item-sub {
      font-size: 0.75rem;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #9ca3af;
      font-size: 0.875rem;
    }

    /* === Detail panel === */
    .detail-panel {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .detail-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 0.875rem;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .detail-header h2 { font-size: 1.25rem; font-weight: 700; }

    .detail-actions { display: flex; gap: 0.5rem; }

    .field-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    /* === Dialog form === */
    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>

  <div class="shell">
    <div class="toolbar">
      <h1>Items</h1>
      <wa-input id="search" placeholder="Search…" size="s" style="width:220px" with-clear>
        <wa-icon slot="prefix" name="magnifying-glass"></wa-icon>
      </wa-input>
      <wa-button variant="brand" size="s" id="btn-new">
        <wa-icon slot="prefix" name="plus"></wa-icon>
        New
      </wa-button>
    </div>

    <div class="split">
      <aside class="list-panel">
        <div class="list-search" style="display:none"><!-- mobile search goes here --></div>
        <div class="list-body" id="list-body">
          <div class="list-empty">No items yet. Click <strong>New</strong> to add one.</div>
        </div>
      </aside>

      <section class="detail-panel" id="detail-panel">
        <div class="detail-empty">Select an item to view details</div>
      </section>
    </div>
  </div>

  <!-- Create / Edit dialog -->
  <wa-dialog id="item-dialog" label="New Item">
    <div class="form-fields">
      <wa-input id="field-name" label="Name" placeholder="Item name" required></wa-input>
      <wa-input id="field-sub" label="Description" placeholder="Short description"></wa-input>
    </div>
    <wa-button slot="footer" id="btn-cancel" variant="neutral">Cancel</wa-button>
    <wa-button slot="footer" id="btn-save" variant="brand">Save</wa-button>
  </wa-dialog>

  <script type="module">
    // === Imports (esm.sh) ===
    // import something from 'https://esm.sh/package-name@version';

    // === State ===
    let items = JSON.parse(localStorage.getItem('crud-items') || '[]');
    let selectedId = null;
    let editingId = null;

    function save() {
      localStorage.setItem('crud-items', JSON.stringify(items));
    }

    function nextId() {
      return Date.now().toString(36);
    }

    // === Custom Elements ===

    class ItemList extends HTMLElement {
      connectedCallback() { this.render(); }

      render() {
        const listBody = document.getElementById('list-body');
        if (items.length === 0) {
          listBody.innerHTML = `<div class="list-empty">No items yet. Click <strong>New</strong> to add one.</div>`;
          return;
        }
        listBody.innerHTML = items.map(item => `
          <div class="list-item ${item.id === selectedId ? 'active' : ''}" data-id="${item.id}">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-sub">${item.sub || '—'}</div>
            </div>
          </div>
        `).join('');

        listBody.querySelectorAll('.list-item').forEach(el => {
          el.addEventListener('click', () => {
            selectedId = el.dataset.id;
            this.render();
            renderDetail();
          });
        });
      }
    }
    customElements.define('item-list', ItemList);

    // === Render functions ===

    function renderDetail() {
      const panel = document.getElementById('detail-panel');
      const item = items.find(i => i.id === selectedId);
      if (!item) {
        panel.innerHTML = `<div class="detail-empty">Select an item to view details</div>`;
        return;
      }
      panel.innerHTML = `
        <div class="detail-header">
          <h2>${item.name}</h2>
          <div class="detail-actions">
            <wa-button size="s" variant="neutral" data-action="edit">
              <wa-icon slot="prefix" name="pencil"></wa-icon>Edit
            </wa-button>
            <wa-button size="s" variant="danger" data-action="delete">
              <wa-icon slot="prefix" name="trash"></wa-icon>Delete
            </wa-button>
          </div>
        </div>
        <div class="field-group">
          <wa-card><span slot="header">Description</span>${item.sub || '—'}</wa-card>
          <wa-card><span slot="header">Created</span>${new Date(item.created).toLocaleDateString()}</wa-card>
        </div>
      `;

      panel.querySelector('[data-action="edit"]').addEventListener('click', () => openDialog(item.id));
      panel.querySelector('[data-action="delete"]').addEventListener('click', () => {
        items = items.filter(i => i.id !== item.id);
        selectedId = null;
        save();
        refresh();
      });
    }

    function refresh() {
      document.querySelector('item-list').render();
      renderDetail();
    }

    // === Dialog ===

    const dialog = document.getElementById('item-dialog');
    const fieldName = document.getElementById('field-name');
    const fieldSub = document.getElementById('field-sub');

    function openDialog(id = null) {
      editingId = id;
      const item = id ? items.find(i => i.id === id) : null;
      dialog.label = id ? 'Edit Item' : 'New Item';
      fieldName.value = item?.name ?? '';
      fieldSub.value = item?.sub ?? '';
      dialog.show();
    }

    document.getElementById('btn-new').addEventListener('click', () => openDialog());
    document.getElementById('btn-cancel').addEventListener('click', () => dialog.hide());
    document.getElementById('btn-save').addEventListener('click', () => {
      const name = fieldName.value.trim();
      if (!name) { fieldName.focus(); return; }

      if (editingId) {
        const item = items.find(i => i.id === editingId);
        item.name = name;
        item.sub = fieldSub.value.trim();
      } else {
        items.push({ id: nextId(), name, sub: fieldSub.value.trim(), created: Date.now() });
      }
      save();
      dialog.hide();
      refresh();
    });

    // === Search ===

    document.getElementById('search').addEventListener('wa-input', e => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.list-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(q) ? '' : 'none';
      });
    });

    // === Bootstrap ===

    document.getElementById('list-body').insertAdjacentHTML('beforebegin', '<item-list></item-list>');
    const listEl = document.querySelector('item-list');
    // Re-wire: item-list renders into #list-body
    listEl.connectedCallback();
  </script>
</body>
</html>
